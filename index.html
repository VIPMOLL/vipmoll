<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>VIP MALL | Premium Marketplace</title>
<style>
:root{--bg:#f8fafc;--surface:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#e11d48;--primary-hover:#be123c;--blue:#2563eb;--shadow:0 4px 6px -1px rgb(0 0 0 / 0.05);--radius:16px;--header-h:64px}
body.dark{--bg:#0f172a;--surface:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155;--primary:#f43f5e;--primary-hover:#e11d48;--blue:#3b82f6;--shadow:0 4px 6px -1px rgb(0 0 0 / 0.5)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Noto Sans Ethiopic",Arial,sans-serif;transition:background 0.3s,color 0.3s;padding-bottom:70px}
button,input,select,textarea{font:inherit;outline:none;border:none}
button{cursor:pointer;border-radius:12px;padding:12px 20px;font-weight:700;transition:all 0.2s}
.primary{background:var(--primary);color:white}
.primary:hover{background:var(--primary-hover);transform:translateY(-1px)}
.soft{background:var(--line);color:var(--text)}
.circle{width:42px;height:42px;border-radius:50%;padding:0;background:var(--surface);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;flex-shrink:0}

/* Header */
.top{position:sticky;top:0;z-index:40;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / 0.05);display:flex;align-items:center;gap:12px;padding:10px max(16px,calc((100vw - 1240px)/2));border-bottom:1px solid var(--line);min-height:var(--header-h);flex-wrap:wrap}
.logo{font-size:22px;font-weight:900;color:var(--primary);letter-spacing:-1px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:24px;background:var(--bg);padding:10px 16px 10px 40px;color:var(--text);font-size:14px;transition:border-color 0.2s}
.search input:focus{border-color:var(--primary)}
.search::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:0.5}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}

/* Categories */
.cat-nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 max(16px,calc((100vw - 1240px)/2));display:flex;overflow-x:auto;gap:20px;scrollbar-width:none;position:sticky;top:64px;z-index:35}
.cat-nav::-webkit-scrollbar{display:none}
.cat-item{white-space:nowrap;padding:14px 0;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:0.2s;display:flex;align-items:center;gap:6px;font-size:14px}
.cat-item.active{color:var(--primary);border-bottom-color:var(--primary)}

/* Layout */
.wrap{max-width:1240px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px}
.sectionhead h2{font-size:20px;margin:0;font-weight:800;color:var(--text)}

/* Product Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.product{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);transition:transform 0.2s,box-shadow 0.2s;position:relative;display:flex;flex-direction:column;cursor:pointer}
.product:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.photo{aspect-ratio:1;background:linear-gradient(135deg,var(--bg),var(--line));display:grid;place-items:center;font-size:50px;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s}
.tag{position:absolute;top:10px;left:10px;background:var(--primary);color:#fff;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:800;z-index:2}
.pbody{padding:12px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.pbody h3{margin:0 0 6px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.price{font-size:16px;font-weight:900;color:var(--blue);margin:4px 0}
.meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:8px}
.seller{display:flex;align-items:center;justify-content:space-between;margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--text);font-weight:800;font-size:10px;margin-right:6px}

/* Product Detail Modal */
.detail-img{width:100%;height:250px;background:var(--bg);border-radius:16px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:80px;border:1px solid var(--line);overflow:hidden}
.detail-img img{width:100%;height:100%;object-fit:contain}
.detail-title{font-size:22px;font-weight:900;margin:0 0 8px}
.detail-price{font-size:24px;font-weight:900;color:var(--blue);margin:0 0 16px}
.detail-desc{color:var(--muted);line-height:1.6;margin-bottom:24px;font-size:14px}
.detail-seller{background:var(--bg);padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.seller-info{display:flex;align-items:center;gap:12px}
.seller-info .avatar{width:40px;height:40px;font-size:18px}

/* Chat System */
.chat-box{display:flex;flex-direction:column;height:350px;background:var(--bg);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.msg.sent{background:var(--primary);color:white;align-self:flex-end;border-bottom-right-radius:4px}
.msg.received{background:var(--surface);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--line)}
.chat-input{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--line)}
.chat-input input{flex:1;padding:10px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
.chat-input button{padding:10px 16px;border-radius:20px;font-size:14px}

/* Payment Options */
.pay-btn{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-bottom:10px;font-weight:700;color:var(--text);cursor:pointer;transition:0.2s}
.pay-btn:hover{border-color:var(--primary);background:var(--surface)}

/* Modals */
.modalback{display:none;position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);z-index:100;align-items:flex-end;justify-content:center;padding:0}
.modalback.show{display:flex}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--surface);color:var(--text);border-radius:24px 24px 0 0;padding:20px;animation:slideUp 0.3s;box-shadow:0 -10px 40px #0004}
.modalhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.modalhead h2{font-size:18px;font-weight:800;margin:0}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px}
.full{width:100%;padding:14px;font-size:15px}

.menu-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--text);background:transparent;width:100%;text-align:left;font-size:15px;margin-bottom:4px;border:1px solid transparent}
.menu-item:hover{background:var(--bg);border-color:var(--line)}
.menu-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--line);flex-shrink:0}

.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;color:#fff}
.login-screen.active{display:flex}
.login-card{width:100%;max-width:400px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,0.5);text-align:center}
.login-card .logo{font-size:30px;margin-bottom:8px;color:#fff;justify-content:center;display:block}
.login-card input{width:100%;padding:14px;margin-bottom:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.2);color:#fff;font-size:14px}
.login-card button{width:100%;padding:14px;background:var(--primary);color:#fff;font-size:15px;border-radius:10px;margin-top:4px}
.login-card .switch{font-size:13px;color:#94a3b8;margin-top:20px}
.login-card .switch span{color:var(--primary);cursor:pointer;font-weight:bold}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding:6px 0;box-shadow:0 -2px 10px #0001}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center}
.b-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;padding:6px 10px;cursor:pointer}
.b-nav-item.active{color:var(--primary)}
.b-nav-item span:first-child{font-size:20px}

@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .cart-panel{display:none}
  .bottom-nav{display:block}
  .top{padding:10px 12px}
  .logo{font-size:18px}
  .search{order:3;width:100%;flex:1 1 100%;margin-top:4px}
  .cat-nav{top:102px;gap:16px;padding:0 12px}
}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .pbody h3{font-size:13px}
  .price{font-size:15px}
}
</style></head>
<body>

<!-- Login Overlay -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo">VIP<span>MALL</span></div>
    <p style="color:#94a3b8;margin-bottom:20px" data-i18n="welcome">የእርስዎ ምርጥ የግዥ ቦታ</p>
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="ኢሜይል / Email" data-i18n-placeholder="email">
      <input type="password" id="loginPassword" placeholder="የይለፍ ቃል / Password" data-i18n-placeholder="password">
      <button onclick="doLogin()" data-i18n="loginBtn">ግባ / Login</button>
      <div class="switch"><span data-i18n="noAccount">መለያ የለህም?</span> <span onclick="showSignup()" data-i18n="signup">ተመዝገብ</span></div>
    </div>
    <div id="signupForm" style="display:none">
      <input type="text" id="signupName" placeholder="ሙሉ ስም / Full Name" data-i18n-placeholder="fullName">
      <input type="email" id="signupEmail" placeholder="ኢሜይል / Email" data-i18n-placeholder="email">
      <input type="password" id="signupPassword" placeholder="የይለፍ ቃል / Password" data-i18n-placeholder="password">
      <input type="tel" id="signupPhone" placeholder="ስልክ ቁጥር / Phone (09...)" data-i18n-placeholder="phone">
      <button onclick="doSignup()" data-i18n="signupBtn">ተመዝገብ</button>
      <div class="switch"><span data-i18n="haveAccount">መለያ አለህ?</span> <span onclick="showLogin()" data-i18n="login">ግባ</span></div>
    </div>
    <div id="loginError" style="color:#ef4444;font-size:12px;margin-top:10px;font-weight:bold"></div>
  </div>
</div>

<!-- Header -->
<header class="top">
  <div class="logo">VIP MALL <span style="font-size:9px;background:var(--primary);color:white;padding:2px 5px;border-radius:4px;vertical-align:middle">PRO</span></div>
  <div class="search"><input id="search" placeholder="ምርቶችን ይፈልጉ..." data-i18n-placeholder="searchPlaceholder"></div>
  <div class="top-actions">
    <button class="circle" id="msgBtn" style="font-size:18px">💬</button>
    <button class="circle" id="settingsBtn" style="font-size:18px">☰</button>
  </div>
</header>

<nav class="cat-nav">
  <div class="cat-item active" data-filter="All"><span data-i18n="catAll">🏠 ሁሉም</span></div>
  <div class="cat-item" data-filter="Electronics"><span data-i18n="catElec">📱 ኤሌክትሮኒክስ</span></div>
  <div class="cat-item" data-filter="Fashion"><span data-i18n="catFash">👕 ልብስ</span></div>
  <div class="cat-item" data-filter="Home"><span data-i18n="catHome">🛋️ የቤት ዕቃ</span></div>
  <div class="cat-item" data-filter="Vehicles"><span data-i18n="catVeh">🚗 መኪና</span></div>
</nav>

<div class="wrap">
  <main>
    <div class="sectionhead">
      <h2 data-i18n="featured">የተመረጡ ምርቶች</h2>
      <span class="meta" id="count">0</span>
    </div>
    <div class="grid" id="products"></div>
  </main>
</div>

<!-- Mobile Bottom Nav -->
<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <div class="b-nav-item active" onclick="window.scrollTo(0,0)"><span>🏠</span><span data-i18n="navHome">መነሻ</span></div>
    <div class="b-nav-item" onclick="document.getElementById('search').focus()"><span>🔍</span><span data-i18n="navSearch">ፍለጋ</span></div>
    <div class="b-nav-item" onclick="openModal('sell')"><span>➕</span><span data-i18n="navSell">ሽጥ</span></div>
    <div class="b-nav-item" onclick="openModal('wallet')"><span>💳</span><span data-i18n="navWallet">ዋሌት</span></div>
    <div class="b-nav-item" onclick="openModal('menu')"><span>☰</span><span data-i18n="navMenu">ሜኑ</span></div>
  </div>
</div>

<!-- Modal Container -->
<div class="modalback" id="modalBack">
  <section class="modal">
    <div class="modalhead">
      <h2 id="modalTitle">VIP MALL</h2>
      <button class="circle" id="closeModal" style="width:30px;height:30px;font-size:14px">✕</button>
    </div>
    <div id="modalContent"></div>
  </section>
</div>

<script>
// ==================== TRANSLATIONS ====================
const i18n = {
  am: {
    welcome: "የእርስዎ ምርጥ የግዥ ቦታ", email: "ኢሜይል", password: "የይለፍ ቃል",
    loginBtn: "ግባ", noAccount: "መለያ የለህም?", signup: "ተመዝገብ",
    fullName: "ሙሉ ስም", phone: "ስልክ ቁጥር", signupBtn: "ተመዝገብ", haveAccount: "መለያ አለህ?", login: "ግባ",
    searchPlaceholder: "ምርቶችን ይፈልጉ...",
    catAll: "ሁሉም", catElec: "ኤሌክትሮኒክስ", catFash: "ልብስ", catHome: "የቤት ዕቃ", catVeh: "መኪና",
    featured: "የተመረጡ ምርቶች", items: "ምርቶች",
    navHome: "መነሻ", navSearch: "ፍለጋ", navSell: "ሽጥ", navWallet: "ዋሌት", navMenu: "ሜኑ",
    menuInbox: "መልእክት", menuSell: "እቃ ሽጥ", menuWallet: "ዋሌት", menuLang: "ቋንቋ", menuDark: "ናይት ሙድ", menuLogout: "ውጣ",
    sellTitle: "አዲስ እቃ ሽጥ", prodName: "የእቃው ስም", category: "ምድብ", price: "ዋጋ (ብር)", location: "አካባቢ", desc: "መግለጫ", photo: "ፎቶ", publish: "እቃውን አሳይ",
    walletTitle: "ዋሌት", balance: "ቀሪ ሂሳብ", paymentMethods: "የክፍያ መንገድ", manualDep: "በእጅ ማስገቢያ (ሙከራ)", amount: "መጠን", deposit: "አስገባ",
    prodDetail: "የምርት ዝርዝር", description: "መግለጫ", place: "ቦታ", verifiedSeller: "የተረጋገጠ ሻጭ", msgSeller: "💬 ሻጩን አግኝ", callSeller: "📞 ይደውሉ",
    chatTitle: "ከ ጋር ተወያይ", typeMsg: "መልእክት ይጻፉ...", send: "ላክ", noMsgs: "ምንም መልእክት የለም",
    langTitle: "ቋንቋ ቀይር", selectLang: "ቋንቋ ምረጥ", savedMsg: "ተቀይሯል!"
  },
  en: {
    welcome: "Your Best Shopping Destination", email: "Email", password: "Password",
    loginBtn: "Login", noAccount: "No account?", signup: "Sign Up",
    fullName: "Full Name", phone: "Phone", signupBtn: "Sign Up", haveAccount: "Have an account?", login: "Login",
    searchPlaceholder: "Search products...",
    catAll: "All", catElec: "Electronics", catFash: "Fashion", catHome: "Home", catVeh: "Vehicles",
    featured: "Featured Products", items: "items",
    navHome: "Home", navSearch: "Search", navSell: "Sell", navWallet: "Wallet", navMenu: "Menu",
    menuInbox: "Inbox", menuSell: "Sell Item", menuWallet: "Wallet", menuLang: "Language", menuDark: "Dark Mode", menuLogout: "Logout",
    sellTitle: "Sell New Item", prodName: "Product Name", category: "Category", price: "Price (ETB)", location: "Location", desc: "Description", photo: "Photo", publish: "Publish",
    walletTitle: "Wallet", balance: "Balance", paymentMethods: "Payment Method", manualDep: "Manual Deposit (Test)", amount: "Amount", deposit: "Deposit",
    prodDetail: "Product Details", description: "Description", place: "Location", verifiedSeller: "Verified Seller", msgSeller: "💬 Message Seller", callSeller: "📞 Call",
    chatTitle: "Chat with", typeMsg: "Type a message...", send: "Send", noMsgs: "No messages yet",
    langTitle: "Change Language", selectLang: "Select Language", savedMsg: "Changed successfully!"
  }
};

let currentLang = localStorage.getItem('vip-lang') || 'am';
let currentUser = JSON.parse(localStorage.getItem('vip-user')) || null;
let users = JSON.parse(localStorage.getItem('vip-users')) || {};
let products = JSON.parse(localStorage.getItem('vip-products')) || [
  { id: 1, name: 'Smartphone X Pro', cat: 'Electronics', price: 12500, loc: 'Addis Ababa', desc: 'Brand new smartphone with 128GB storage.', img: '', seller: 'SMART Store', phone: '0911223344' },
  { id: 2, name: 'Fashion Sneakers', cat: 'Fashion', price: 2300, loc: 'Jimma', desc: 'Original leather sneakers.', img: '', seller: 'Abebe Store', phone: '0911556677' }
];
let messages = JSON.parse(localStorage.getItem('vip-messages')) || {};
let currentFilter = 'All';

const $ = id => document.getElementById(id);
const t = key => i18n[currentLang][key] || i18n['en'][key] || key;

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
  renderProducts();
}

function saveData() {
  localStorage.setItem('vip-products', JSON.stringify(products));
  localStorage.setItem('vip-messages', JSON.stringify(messages));
  localStorage.setItem('vip-users', JSON.stringify(users));
  localStorage.setItem('vip-lang', currentLang);
}

// ==================== RENDER PRODUCTS ====================
function renderProducts() {
  const q = $('search').value.toLowerCase();
  const grid = $('products');
  grid.innerHTML = '';
  let count = 0;

  products.filter(p => {
    const matchCat = currentFilter === 'All' || p.cat === currentFilter;
    const matchQ = p.name.toLowerCase().includes(q);
    return matchCat && matchQ;
  }).forEach(p => {
    count++;
    const card = document.createElement('article');
    card.className = 'product';
    card.onclick = () => openProductDetail(p.id);
    card.innerHTML = `
      <div class="photo">
        ${p.img ? `<img src="${p.img}" alt="${p.name}">` : `📦`}
        <span class="tag">NEW</span>
      </div>
      <div class="pbody">

// ==================== CHAT SYSTEM ====================
function contactSeller(productId) {
  if (!currentUser) { checkAuth(); return; }
  const p = products.find(x => x.id === productId);
  const chatId = `chat_${productId}_${currentUser}`;

  if (!messages[chatId]) {
    messages[chatId] = [
      { sender: p.seller, text: `Hello! You asked about "${p.name}". How can I help you?`, time: new Date().toLocaleTimeString() }
    ];
    saveData();
  }

  $('modalTitle').innerText = `${t('chatTitle')} ${p.seller}`;
  $('modalContent').innerHTML = `
    <div class="chat-box">
      <div class="chat-messages" id="chatMsgs">
        ${messages[chatId].map(m => `
          <div class="msg ${m.sender === currentUser ? 'sent' : 'received'}">
            ${m.text}
            <div style="font-size:9px;opacity:0.7;margin-top:4px;text-align:right">${m.time}</div>
          </div>
        `).join('')}
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="${t('typeMsg')}" onkeypress="if(event.key==='Enter') sendMsg('${chatId}', '${p.seller}', ${p.id})">
        <button class="primary" onclick="sendMsg('${chatId}', '${p.seller}', ${p.id})">${t('send')}</button>
      </div>
    </div>
  `;
  
  setTimeout(() => {
    const msgs = $('chatMsgs');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }, 100);
}

function sendMsg(chatId, sellerName, productId) {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;

  messages[chatId].push({ sender: currentUser, text, time: new Date().toLocaleTimeString() });
  saveData();
  input.value = '';
  
  const msgs = $('chatMsgs');
  const div = document.createElement('div');
  div.className = 'msg sent';
  div.innerHTML = `${text}<div style="font-size:9px;opacity:0.7;margin-top:4px;text-align:right">${new Date().toLocaleTimeString()}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;

  setTimeout(() => {
    messages[chatId].push({ sender: sellerName, text: "Ok, I understand. We will contact you soon.", time: new Date().toLocaleTimeString() });
    saveData();
    const replyDiv = document.createElement('div');
    replyDiv.className = 'msg received';
    replyDiv.innerHTML = `Ok, I understand. We will contact you soon.<div style="font-size:9px;opacity:0.7;margin-top:4px">${new Date().toLocaleTimeString()}</div>`;
    msgs.appendChild(replyDiv);
    msgs.scrollTop = msgs.scrollHeight;
  }, 1500);
}

function openInbox() {
  if (!currentUser) { checkAuth(); return; }
  const chatIds = Object.keys(messages);
  $('modalTitle').innerText = t('menuInbox');
  if (chatIds.length === 0) {
    $('modalContent').innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">${t('noMsgs')}</div>`;
  } else {
    $('modalContent').innerHTML = chatIds.map(id => {
      const parts = id.split('_');
      const prodId = parts[1];
      const prod = products.find(x => x.id == prodId) || { name: 'Unknown', seller: 'Seller' };
      const lastMsg = messages[id][messages[id].length - 1];
      return `
        <div class="menu-item" onclick="contactSeller(${prodId})">
          <div class="menu-icon">💬</div>
          <div style="flex:1;overflow:hidden">
            <div style="font-weight:bold">${prod.seller}</div>
            <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lastMsg.text}</div>
          </div>
        </div>
      `;
    }).join('');
  }
  $('modalBack').classList.add('show');
}

// ==================== SELL PRODUCT ====================
function openSellModal() {
  if (!currentUser) { checkAuth(); return; }
  $('modalTitle').innerText = t('sellTitle');
  $('modalContent').innerHTML = `
    <div class="field"><label>${t('prodName')}</label><input id="sellName" placeholder="iPhone 13"></div>
    <div class="field"><label>${t('category')}</label>
      <select id="sellCat">
        <option value="Electronics">${t('catElec')}</option>
        <option value="Fashion">${t('catFash')}</option>
        <option value="Home">${t('catHome')}</option>
        <option value="Vehicles">${t('catVeh')}</option>
      </select>
    </div>
    <div class="field"><label>${t('price')}</label><input id="sellPrice" type="number" placeholder="0"></div>
    <div class="field"><label>${t('location')}</label><input id="sellLoc" placeholder="Addis Ababa"></div>
    <div class="field"><label>${t('desc')}</label><textarea id="sellDesc" placeholder="..."></textarea></div>
    <div class="field"><label>${t('photo')}</label><input type="file" id="sellImg" accept="image/*" style="padding:10px"></div>
    <button class="primary full" onclick="publishProduct()">${t('publish')}</button>
  `;
  $('modalBack').classList.add('show');
}

function publishProduct() {
  const name = $('sellName').value.trim();
  const cat = $('sellCat').value;
  const price = Number($('sellPrice').value);
  const loc = $('sellLoc').value.trim() || 'Addis Ababa';
  const desc = $('sellDesc').value.trim() || 'No description';
  const phone = users[currentUser].phone || '0900000000';
  const imgFile = $('sellImg').files[0];

  if (!name || !price) { alert('Name & Price required!'); return; }

  const saveProduct = (imgData) => {
    const newProduct = {
      id: Date.now(), name, cat, price, loc, desc, img: imgData, seller: users[currentUser].name, phone
    };
    products.unshift(newProduct);
    saveData();
    closeModal();
    renderProducts();
    alert('✅ Item published!');
  };

  if (imgFile) {
    const reader = new FileReader();
    reader.onload = (e) => saveProduct(e.target.result);
    reader.readAsDataURL(imgFile);
  } else {
    saveProduct('');
  }
}

// ==================== AUTH SYSTEM ====================
function checkAuth() {
  if (!currentUser) $('loginScreen').classList.add('active');
  else $('loginScreen').classList.remove('active');
}

function showSignup() {
  $('loginForm').style.display = 'none';
  $('signupForm').style.display = 'block';
  $('loginError').innerText = '';
}

function showLogin() {
  $('signupForm').style.display = 'none';
  $('loginForm').style.display = 'block';
  $('loginError').innerText = '';
}

function doSignup() {
  const name = $('signupName').value.trim();
  const email = $('signupEmail').value.trim();
  const pass = $('signupPassword').value;
  const phone = $('signupPhone').value.trim();
  
  if (!name || !email || !pass || !phone) { $('loginError').innerText = 'Fill all fields!'; return; }
  if (users[email]) { $('loginError').innerText = 'Email exists!'; return; }
  
  users[email] = { name, pass, phone, balance: 0 };
  currentUser = email;
  localStorage.setItem('vip-user', JSON.stringify(currentUser));
  saveData();
  checkAuth();
}

function doLogin() {
  const email = $('loginEmail').value.trim();
  const pass = $('loginPassword').value;
  if (users[email] && users[email].pass === pass) {
    currentUser = email;
    localStorage.setItem('vip-user', JSON.stringify(currentUser));
    checkAuth();
  } else {
    $('loginError').innerText = 'Wrong email or password!';
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem('vip-user');
  checkAuth();
  closeModal();
}

function openModal(type) {
  if (type === 'sell') openSellModal();
  else if (type === 'wallet') openWallet();
  else if (type === 'menu') {
    $('modalTitle').innerText = t('navMenu');
    $('modalContent').innerHTML = `

      </select>

function changeLanguage(lang) {
  currentLang = lang;
  saveData();
  applyTranslations();

  closeModal();
}

function closeModal() { $('modalBack').classList.remove('show'); }

$('search').addEventListener('input', renderProducts);
document.querySelectorAll('.cat-item').forEach(item => {

    document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));

  });
});

// Theme
function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('vip-dark', document.body.classList.contains('dark') ? '1' : '0');
  closeModal();
}
if (localStorage.getItem('vip-dark') === '1') document.body.classList.add('dark');

// Events
$('settingsBtn').onclick = () => openModal('menu');
$('msgBtn').onclick = () => openInbox();
$('closeModal').onclick = closeModal;
$('modalBack').onclick = (e) => { if (e.target === $('modalBack')) closeModal(); };

// INIT
applyTranslations();
checkAuth();
</script>
