<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e0e5ec">
<title>VIP MALL | Premium Marketplace</title>

<script type="module">

  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPhoneNumber, RecaptchaVerifier, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyB3Tlmdy7inGamQwb0CW_RbvBVo3-jCk7U",

    projectId: "smart-trading-number-1",
    storageBucket: "smart-trading-number-1.firebasestorage.app",

<style>
:root {
  --bg: #e0e5ec;
  --surface: #e0e5ec;
  --text: #2d3748;
  --muted: #718096;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --blue: #4f46e5;
  --shadow-dark: #a3b1c6;
  --shadow-light: #ffffff;
  --shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
  --shadow-inset: inset 6px 6px 10px var(--shadow-dark), inset -6px -6px 10px var(--shadow-light);
  --radius: 20px;
}

body.dark {
  --bg: #1a202c;
  --surface: #1a202c;
  --text: #f7fafc;
  --muted: #a0aec0;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --blue: #6366f1;
  --shadow-dark: #12151c;
  --shadow-light: #222a38;
  --shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
  --shadow-inset: inset 6px 6px 10px var(--shadow-dark), inset -6px -6px 10px var(--shadow-light);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Noto Sans Ethiopic",Arial,sans-serif;transition:background 0.3s,color 0.3s;padding-bottom:80px}
button,input,select,textarea{font:inherit;outline:none;border:none;background:transparent}
button{cursor:pointer;border-radius:12px;padding:14px 20px;font-weight:700;transition:all 0.2s}
.primary{background:var(--primary);color:white;box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);border:none}
.primary:hover{background:var(--primary-hover);transform:translateY(-2px);box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light)}
.primary:active{box-shadow: var(--shadow-inset);transform:translateY(0)}
.soft{background:var(--bg);color:var(--text);box-shadow: var(--shadow);border:none}
.soft:active{box-shadow: var(--shadow-inset)}
.circle{width:46px;height:46px;border-radius:50%;padding:0;background:var(--bg);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);border:none;flex-shrink:0}
.circle:active{box-shadow:var(--shadow-inset)}

/* Header */
.top{position:sticky;top:0;z-index:40;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px max(16px,calc((100vw - 1240px)/2));min-height:70px;flex-wrap:wrap}
.logo-img{height:40px;object-fit:contain;border-radius:8px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border-radius:24px;background:var(--bg);padding:14px 16px 14px 44px;color:var(--text);font-size:14px;box-shadow:var(--shadow-inset);border:none}
.search::before{content:'🔍';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0.5}
.top-actions{display:flex;gap:12px;align-items:center;margin-left:auto}

/* Categories */
.cat-nav{background:var(--bg);padding:0 max(16px,calc((100vw - 1240px)/2));display:flex;overflow-x:auto;gap:16px;scrollbar-width:none;position:sticky;top:70px;z-index:35;padding-bottom:12px}
.cat-nav::-webkit-scrollbar{display:none}
.cat-item{white-space:nowrap;padding:12px 20px;color:var(--muted);font-weight:700;cursor:pointer;border-radius:16px;transition:0.2s;display:flex;align-items:center;gap:8px;font-size:14px;background:var(--bg);box-shadow:var(--shadow);border:none}
.cat-item.active{color:var(--primary);box-shadow:var(--shadow-inset)}
.cat-item:active{box-shadow:var(--shadow-inset)}

/* Layout */
.wrap{max-width:1240px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 20px;padding:0 8px}
.sectionhead h2{font-size:20px;margin:0;font-weight:900;color:var(--text)}

/* Product Grid (3D Cards) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.product{background:var(--bg);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform 0.2s,box-shadow 0.2s;position:relative;display:flex;flex-direction:column;cursor:pointer;border:none}
.product:active{box-shadow:var(--shadow-inset)}
.photo{aspect-ratio:1;background:var(--bg);display:grid;place-items:center;font-size:50px;position:relative;overflow:hidden;margin:12px;border-radius:16px;box-shadow:var(--shadow-inset)}
.photo img,.photo video{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;background:var(--primary);color:#fff;border-radius:8px;padding:4px 10px;font-size:10px;font-weight:800;z-index:2;box-shadow:0 4px 10px rgba(79,70,229,0.4)}
.pbody{padding:16px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.pbody h3{margin:0 0 8px;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.price{font-size:18px;font-weight:900;color:var(--primary);margin:4px 0}
.meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:12px;font-weight:600}
.seller{display:flex;align-items:center;justify-content:space-between;margin-top:auto;font-size:12px;color:var(--muted);padding-top:12px;border-top:1px solid var(--shadow-dark);font-weight:600}
.avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--primary);font-weight:900;font-size:12px;margin-right:8px;box-shadow:var(--shadow)}

/* Product Detail Modal */
.detail-img{width:100%;height:280px;background:var(--bg);border-radius:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:80px;box-shadow:var(--shadow-inset);overflow:hidden}
.detail-img img,.detail-img video{width:100%;height:100%;object-fit:contain}
.detail-title{font-size:24px;font-weight:900;margin:0 0 8px}
.detail-price{font-size:28px;font-weight:900;color:var(--primary);margin:0 0 16px}
.detail-desc{color:var(--muted);line-height:1.6;margin-bottom:24px;font-size:14px;font-weight:500}
.detail-seller{background:var(--bg);padding:20px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;box-shadow:var(--shadow)}
.seller-info{display:flex;align-items:center;gap:16px}
.seller-info .avatar{width:48px;height:48px;font-size:20px}

/* Chat System */
.chat-box{display:flex;flex-direction:column;height:350px;background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-inset)}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:85%;padding:14px 18px;border-radius:20px;font-size:14px;line-height:1.5;font-weight:600}
.msg.sent{background:var(--primary);color:white;align-self:flex-end;border-bottom-right-radius:6px;box-shadow:4px 4px 10px rgba(79,70,229,0.3)}
.msg.received{background:var(--bg);color:var(--text);align-self:flex-start;border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.chat-input{display:flex;gap:12px;padding:16px;background:var(--bg);border-top:1px solid var(--shadow-dark)}
.chat-input input{flex:1;padding:14px;border-radius:24px;background:var(--bg);color:var(--text);font-size:14px;box-shadow:var(--shadow-inset);border:none}
.chat-input button{padding:14px 24px;border-radius:24px;font-size:14px}

/* Payment Options */
.pay-btn{display:flex;align-items:center;gap:16px;width:100%;padding:20px;border-radius:20px;background:var(--bg);margin-bottom:16px;font-weight:800;color:var(--text);cursor:pointer;transition:0.2s;box-shadow:var(--shadow);border:none;font-size:16px}
.pay-btn:active{box-shadow:var(--shadow-inset)}
.pay-btn:hover{border-color:var(--primary);background:var(--surface)}

/* Modals */
.modalback{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(5px);z-index:100;align-items:flex-end;justify-content:center;padding:0}
.modalback.show{display:flex}
.modal{width:100%;max-width:540px;max-height:92vh;overflow:auto;background:var(--bg);color:var(--text);border-radius:30px 30px 0 0;padding:30px;animation:slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);box-shadow:0 -10px 40px rgba(0,0,0,0.2)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.modalhead h2{font-size:22px;font-weight:900;margin:0}
.field{display:grid;gap:8px;margin:16px 0;position:relative}
.field label{font-size:14px;font-weight:800;color:var(--muted);margin-left:4px}
.field input,.field select,.field textarea{width:100%;padding:16px;border:none;border-radius:16px;background:var(--bg);color:var(--text);font-size:15px;box-shadow:var(--shadow-inset);font-weight:600}
.field input[type="password"]{padding-right:50px}
.eye-icon{position:absolute;right:16px;bottom:16px;cursor:pointer;font-size:20px;user-select:none;opacity:0.7}
.full{width:100%;padding:18px;font-size:16px;border-radius:16px}

.menu-item{display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;cursor:pointer;font-weight:800;color:var(--text);background:var(--bg);width:100%;text-align:left;font-size:16px;margin-bottom:12px;border:none;box-shadow:var(--shadow);transition:0.2s}
.menu-item:active{box-shadow:var(--shadow-inset)}
.menu-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--bg);box-shadow:var(--shadow);flex-shrink:0}

/* Login Screen (Neumorphism 3D) */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.login-screen.active{display:flex}
.login-card{width:100%;max-width:400px;background:var(--bg);border-radius:32px;padding:36px;box-shadow:var(--shadow);text-align:center;position:relative}
.login-card .logo{font-size:30px;margin-bottom:12px;justify-content:center;display:block}
.login-tabs{display:flex;background:var(--bg);border-radius:16px;padding:6px;margin-bottom:24px;box-shadow:var(--shadow-inset)}
.login-tabs button{flex:1;padding:12px;border-radius:12px;background:transparent;color:var(--muted);font-size:14px;font-weight:800;transition:0.2s;box-shadow:none;border:none}
.login-tabs button.active{background:var(--bg);color:var(--primary);box-shadow:var(--shadow)}
.login-card input{width:100%;padding:16px;margin-bottom:16px;border-radius:16px;border:none;background:var(--bg);color:var(--text);font-size:15px;box-shadow:var(--shadow-inset);font-weight:600}
.login-card button.primary{width:100%;padding:16px;font-size:16px;margin-top:8px;border-radius:16px}
.login-card .switch{font-size:14px;color:var(--muted);margin-top:24px;font-weight:600}
.login-card .switch span{color:var(--primary);cursor:pointer;font-weight:bold}
#recaptcha-container{display:none;margin-bottom:10px}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg);z-index:50;padding:12px 0;box-shadow:0 -4px 20px rgba(0,0,0,0.1);border-top:none}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;max-width:500px;margin:0 auto}
.b-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:700;padding:8px 12px;cursor:pointer;border-radius:16px;transition:0.2s;background:var(--bg);box-shadow:none}
.b-nav-item.active{color:var(--primary);box-shadow:var(--shadow-inset);padding:8px 16px}
.b-nav-item span:first-child{font-size:22px}

@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .cart-panel{display:none}
  .bottom-nav{display:block}
  .top{padding:12px 16px;min-height:auto}
  .logo-img{height:32px}
  .search{order:3;width:100%;flex:1 1 100%;margin-top:8px}
  .cat-nav{top:122px;gap:12px;padding:0 16px 12px}
}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);gap:16px}
  .pbody{padding:12px}
  .pbody h3{font-size:13px}
  .price{font-size:16px}
}
</style></head>
<body>

<!-- Login Overlay -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo" style="margin-bottom:20px">
      <img src="logo.png" alt="VIP MALL" style="height:80px;object-fit:contain;border-radius:16px;box-shadow:var(--shadow)" onerror="this.outerHTML='<h1 style=\'margin:0;font-weight:900;color:var(--primary)\'>VIP MALL</h1>'">
    </div>
    <p style="color:var(--muted);margin-bottom:24px;font-size:15px;font-weight:600" data-i18n="welcome">የእርስዎ ምርጥ የግዥ ቦታ</p>
    
    <div class="login-tabs" id="loginTabs">
      <button class="active" onclick="switchAuthTab('email')" data-i18n="tabEmail">📧 Email</button>
      <button onclick="switchAuthTab('phone')" data-i18n="tabPhone">📱 Phone</button>
    </div>

    <div id="loginForm">
      <div id="emailForm">
        <input type="email" id="loginEmail" placeholder="ኢሜይል / Email" data-i18n-placeholder="email">
        <div class="field" style="margin:0 0 16px 0">
          <input type="password" id="loginPassword" placeholder="የይለፍ ቃል / Password" data-i18n-placeholder="password" style="padding-right:50px;margin-bottom:0">
          <span class="eye-icon" onclick="togglePass('loginPassword', this)">👁️</span>
        </div>
        <button class="primary" onclick="doEmailLogin()" data-i18n="loginBtn">ግባ / Login</button>
      </div>

      <div id="phoneForm" style="display:none">
        <input type="tel" id="loginPhone" placeholder="+2519XXXXXXXX">
        <button class="primary" onclick="doPhoneLogin()" id="sendSmsBtn" data-i18n="sendCode">SMS ኮድ ላክ</button>
        <div id="otpDiv" style="display:none;margin-top:16px">
          <input type="text" id="loginOtp" placeholder="6-digit Code" maxlength="6" style="text-align:center;letter-spacing:6px;font-weight:900;font-size:20px">
          <button class="primary" onclick="verifyPhoneCode()" data-i18n="verify">አረጋግጥ</button>
        </div>
        <div id="recaptcha-container"></div>
      </div>
      
      <div class="switch" style="margin-top:24px">
        <span data-i18n="noAccount">መለያ የለህም?</span> 
        <span onclick="showSignup()" data-i18n="signup">ተመዝገብ</span>
      </div>
    </div>

    <div id="signupForm" style="display:none">
      <input type="text" id="signupName" placeholder="ሙሉ ስም / Full Name" data-i18n-placeholder="fullName">
      <input type="email" id="signupEmail" placeholder="ኢሜይል / Email" data-i18n-placeholder="email">
      <div class="field" style="margin:0 0 16px 0">
        <input type="password" id="signupPassword" placeholder="የይለፍ ቃል / Password" data-i18n-placeholder="password" style="padding-right:50px;margin-bottom:0">
        <span class="eye-icon" onclick="togglePass('signupPassword', this)">👁️</span>
      </div>
      <input type="tel" id="signupPhone" placeholder="ስልክ ቁጥር / Phone (09...)" data-i18n-placeholder="phone">
      <button class="primary" onclick="doSignup()" data-i18n="signupBtn">ተመዝገብ / Sign Up</button>
      <div class="switch" style="margin-top:24px">
        <span data-i18n="haveAccount">መለያ አለህ?</span> 
        <span onclick="showLogin()" data-i18n="login">ግባ</span>
      </div>
    </div>
    
    <div id="loginError" style="color:#ef4444;font-size:13px;margin-top:16px;font-weight:800"></div>
  </div>
</div>

<!-- Header -->
<header class="top">
  <img src="logo.png" alt="VIP MALL" class="logo-img" onerror="this.outerHTML='<div class=\'logo\' style=\'font-size:22px;font-weight:900;color:var(--primary)\'>VIP MALL</div>'">
  <div class="search"><input id="search" placeholder="ምርቶችን ይፈልጉ..." data-i18n-placeholder="searchPlaceholder"></div>
  <div class="top-actions">
    <button class="circle" id="msgBtn" style="font-size:20px;">💬</button>
  </div>
</header>

<nav class="cat-nav">
  <div class="cat-item active" data-filter="All"><span data-i18n="catAll">🏠 ሁሉም</span></div>
  <div class="cat-item" data-filter="Electronics"><span data-i18n="catElec">📱 ኤሌክትሮኒክስ</span></div>
  <div class="cat-item" data-filter="Fashion"><span data-i18n="catFash">👕 ልብስ</span></div>
  <div class="cat-item" data-filter="Home"><span data-i18n="catHome">🛋️ የቤት ዕቃ</span></div>
  <div class="cat-item" data-filter="Vehicles"><span data-i18n="catVeh">🚗 መኪና</span></div>
</nav>

<div class="wrap">
  <main>
    <div class="sectionhead">
      <h2 data-i18n="featured">የተመረጡ ምርቶች</h2>
      <span class="meta" id="count">0</span>
    </div>
    <div class="grid" id="products"></div>
  </main>
</div>

<!-- Mobile Bottom Nav -->
<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <div class="b-nav-item active" onclick="window.scrollTo(0,0)"><span>🏠</span><span data-i18n="navHome">መነሻ</span></div>
    <div class="b-nav-item" onclick="document.getElementById('search').focus()"><span>🔍</span><span data-i18n="navSearch">ፍለጋ</span></div>
    <div class="b-nav-item" onclick="openModal('sell')"><span>➕</span><span data-i18n="navSell">ሽጥ</span></div>
    <div class="b-nav-item" onclick="openModal('wallet')"><span>💳</span><span data-i18n="navWallet">ዋሌት</span></div>
    <div class="b-nav-item" onclick="openModal('menu')"><span>☰</span><span data-i18n="navMenu">ሜኑ</span></div>
  </div>
</div>

<!-- Modal Container -->
<div class="modalback" id="modalBack">
  <section class="modal">
    <div class="modalhead">
      <h2 id="modalTitle">VIP MALL</h2>
      <button class="circle" id="closeModal" style="width:36px;height:36px;font-size:16px">✕</button>
    </div>
    <div id="modalContent"></div>
  </section>
</div>

<script>
// ==================== TRANSLATIONS ====================
const i18n = {
  am: {
    welcome: "የእርስዎ ምርጥ የግዥ ቦታ", email: "ኢሜይል", password: "የይለፍ ቃል",
    loginBtn: "ግባ", noAccount: "መለያ የለህም?", signup: "ተመዝገብ",
    fullName: "ሙሉ ስም", phone: "ስልክ ቁጥር", signupBtn: "ተመዝገብ", haveAccount: "መለያ አለህ?", login: "ግባ",
    searchPlaceholder: "ምርቶችን ይፈልጉ...", tabEmail: "📧 ኢሜይል", tabPhone: "📱 ስልክ",
    sendCode: "SMS ኮድ ላክ", verify: "አረጋግጥ",

// ==================== FIREBASE AUTH SYSTEM ====================
async function doEmailLogin() {
  const email = $('loginEmail').value.trim();
  const pass = $('loginPassword').value;
  if (!email || !pass) { $('loginError').innerText = 'Fill all fields!'; return; }
  
  try {
    const userCredential = await window.fbSignIn(window.auth, email, pass);
    currentUser = email;
    localStorage.setItem('vip-user', JSON.stringify(currentUser));
    if (!users[email]) users[email] = { name: email.split('@')[0], pass, phone: '', balance: 0 };
    saveData();
    checkAuth();
  } catch(e) {
    $('loginError').innerText = e.message.replace('Firebase: ', '');
  }
}

async function doSignup() {
  const name = $('signupName').value.trim();
  const email = $('signupEmail').value.trim();
  const pass = $('signupPassword').value;
  const phone = $('signupPhone').value.trim();
  
  if (!name || !email || !pass || !phone) { $('loginError').innerText = 'Fill all fields!'; return; }
  if (pass.length < 6) { $('loginError').innerText = 'Password must be 6+ chars!'; return; }
  
  try {
    await window.fbCreateUser(window.auth, email, pass);
    users[email] = { name, pass, phone, balance: 0 };
    currentUser = email;
    localStorage.setItem('vip-user', JSON.stringify(currentUser));
    saveData();
    checkAuth();
  } catch(e) {
    $('loginError').innerText = e.message.replace('Firebase: ', '');
  }
}

async function doPhoneLogin() {
  const phone = $('loginPhone').value.trim();
  if (!phone) { $('loginError').innerText = 'Enter phone number!'; return; }
  
  $('loginError').innerText = 'Sending SMS...';
  $('recaptcha-container').style.display = 'block';
  
  try {
    if (!window.recaptchaVerifier) {
      window.recaptchaVerifier = new window.fbRecaptcha(window.auth, 'recaptcha-container', { size: 'invisible' });
    }
    confirmationResult = await window.fbPhoneSignIn(window.auth, phone, window.recaptchaVerifier);
    $('loginError').innerText = '';
    $('otpDiv').style.display = 'block';
    $('sendSmsBtn').innerText = 'Resend SMS';
  } catch(e) {
    $('loginError').innerText = e.message.replace('Firebase: ', '');
    $('recaptcha-container').style.display = 'none';
  }
}

async function verifyPhoneCode() {
  const code = $('loginOtp').value.trim();
  if (!code) return;
  
  try {
    const result = await confirmationResult.confirm(code);
    currentUser = result.user.phoneNumber;
    localStorage.setItem('vip-user', JSON.stringify(currentUser));
    if (!users[currentUser]) users[currentUser] = { name: 'User', phone: currentUser, balance: 0 };
    saveData();
    checkAuth();
  } catch(e) {
    $('loginError').innerText = 'Invalid code!';
  }
}

function doLogout() {
  window.fbSignOut(window.auth).catch(()=>{});
  currentUser = null;
  localStorage.removeItem('vip-user');
  checkAuth();
  closeModal();
}

function showSignup() {
  $('loginForm').style.display = 'none';
  $('signupForm').style.display = 'block';
  $('loginError').innerText = '';
}

function showLogin() {
  $('signupForm').style.display = 'none';
  $('loginForm').style.display = 'block';
  $('loginError').innerText = '';
}

function checkAuth() {
  if (!currentUser) $('loginScreen').classList.add('active');
  else $('loginScreen').classList.remove('active');
}

// ==================== RENDER PRODUCTS ====================
function renderProducts() {
  const q = $('search').value.toLowerCase();
  const grid = $('products');
  grid.innerHTML = '';
  let count = 0;

  products.filter(p => {
    const matchCat = currentFilter === 'All' || p.cat === currentFilter;
    const matchQ = p.name.toLowerCase().includes(q);
    return matchCat && matchQ;
  }).forEach(p => {
    count++;
    const card = document.createElement('article');
    card.className = 'product';
    card.onclick = () => openProductDetail(p.id);
    card.innerHTML = `
      <div class="photo">
        ${p.img ? (p.isVideo ? `<video src="${p.img}" muted></video>` : `<img src="${p.img}" alt="${p.name}">`) : `📦`}
        <span class="tag">NEW</span>
      </div>
      <div class="pbody">
        <h3>${p.name}</h3>
        <div class="price">${p.price.toLocaleString()} ETB</div>
        <div class="meta">📍 ${p.loc}</div>
        <div class="seller">
          <div style="display:flex;align-items:center"><span class="avatar">${p.seller[0]}</span> ${p.seller}</div>
          <span style="color:var(--primary);font-weight:bold">→</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  $('count').innerText = count + ' ' + t('items');
}

// ==================== CHAT SYSTEM ====================
function contactSeller(productId) {
  if (!currentUser) { checkAuth(); return; }
  const p = products.find(x => x.id === productId);
  const chatId = `chat_${productId}_${currentUser}`;

  if (!messages[chatId]) {
    messages[chatId] = [
      { sender: p.seller, text: `Hello! You asked about "${p.name}". How can I help you?`, time: new Date().toLocaleTimeString() }
    ];
    saveData();
  }

  $('modalTitle').innerText = `${t('chatTitle')} ${p.seller}`;
  $('modalContent').innerHTML = `
    <div class="chat-box">
      <div class="chat-messages" id="chatMsgs">
        ${messages[chatId].map(m => `
          <div class="msg ${m.sender === currentUser ? 'sent' : 'received'}">
            ${m.text}
            <div style="font-size:9px;opacity:0.7;margin-top:4px;text-align:right">${m.time}</div>
          </div>
        `).join('')}
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="${t('typeMsg')}" onkeypress="if(event.key==='Enter') sendMsg('${chatId}', '${p.seller}', ${p.id})">
        <button class="primary" onclick="sendMsg('${chatId}', '${p.seller}', ${p.id})">${t('send')}</button>
      </div>
    </div>
  `;
  
  setTimeout(() => {
    const msgs = $('chatMsgs');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }, 100);
}

function sendMsg(chatId, sellerName, productId) {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;

  messages[chatId].push({ sender: currentUser, text, time: new Date().toLocaleTimeString() });
  saveData();
  input.value = '';
  
  const msgs = $('chatMsgs');
  const div = document.createElement('div');
  div.className = 'msg sent';
  div.innerHTML = `${text}<div style="font-size:9px;opacity:0.7;margin-top:4px;text-align:right">${new Date().toLocaleTimeString()}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;

  setTimeout(() => {
    messages[chatId].push({ sender: sellerName, text: "Ok, I understand. We will contact you soon.", time: new Date().toLocaleTimeString() });
    saveData();
    const replyDiv = document.createElement('div');
    replyDiv.className = 'msg received';
    replyDiv.innerHTML = `Ok, I understand. We will contact you soon.<div style="font-size:9px;opacity:0.7;margin-top:4px">${new Date().toLocaleTimeString()}</div>`;
    msgs.appendChild(replyDiv);
    msgs.scrollTop = msgs.scrollHeight;
  }, 1500);
}

function openInbox() {
  if (!currentUser) { checkAuth(); return; }
  const chatIds = Object.keys(messages);
  $('modalTitle').innerText = t('menuInbox');
  if (chatIds.length === 0) {
    $('modalContent').innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">${t('noMsgs')}</div>`;
  } else {
    $('modalContent').innerHTML = chatIds.map(id => {
      const parts = id.split('_');
      const prodId = parts[1];
      const prod = products.find(x => x.id == prodId) || { name: 'Unknown', seller: 'Seller' };
      const lastMsg = messages[id][messages[id].length - 1];
      return `
        <div class="menu-item" onclick="contactSeller(${prodId})">
          <div class="menu-icon">💬</div>
          <div style="flex:1;overflow:hidden">
            <div style="font-weight:bold">${prod.seller}</div>
            <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lastMsg.text}</div>
          </div>
        </div>
      `;
    }).join('');
  }
  $('modalBack').classList.add('show');
}

function publishProduct() {
  const name = $('sellName').value.trim();
  const cat = $('sellCat').value;
  const price = Number($('sellPrice').value);
  const loc = $('sellLoc').value.trim() || 'Addis Ababa';
  const desc = $('sellDesc').value.trim() || 'No description';
  const phone = users[currentUser]?.phone || '0900000000';
  const file = $('sellImg').files[0];

  if (!name || !price) { alert('Name & Price required!'); return; }

  const saveProduct = (fileData, isVideo) => {
    const newProduct = {
      id: Date.now(), name, cat, price, loc, desc, img: fileData, isVideo, seller: users[currentUser]?.name || 'User', phone
    };
    products.unshift(newProduct);
    saveData();
    closeModal();
    renderProducts();
    alert('✅ Item published!');
  };

  if (file) {
    const isVideo = file.type.startsWith('video/');
    const reader = new FileReader();
    reader.onload = (e) => saveProduct(e.target.result, isVideo);
    reader.readAsDataURL(file);
  } else {
    saveProduct('', false);
  }
}

<script>
if ('serviceWorker' in navigator) {
  const swCode = "self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});";
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(err => console.log('SW err:', err));
}
</script>
