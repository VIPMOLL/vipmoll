<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>VIP MALL | Premium Marketplace</title>
<style>
:root{--bg:#f8fafc;--surface:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#e11d48;--primary-hover:#be123c;--blue:#2563eb;--shadow:0 4px 6px -1px rgb(0 0 0 / 0.05);--radius:16px;--header-h:64px}
body.dark{--bg:#0f172a;--surface:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155;--primary:#f43f5e;--primary-hover:#e11d48;--blue:#3b82f6;--shadow:0 4px 6px -1px rgb(0 0 0 / 0.5)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Noto Sans Ethiopic",Arial,sans-serif;transition:background 0.3s,color 0.3s;padding-bottom:60px}
button,input,select,textarea{font:inherit;outline:none;border:none}
button{cursor:pointer;border-radius:12px;padding:12px 20px;font-weight:700;transition:all 0.2s}
.primary{background:var(--primary);color:white}
.primary:hover{background:var(--primary-hover);transform:translateY(-1px)}
.soft{background:var(--line);color:var(--text)}
.circle{width:42px;height:42px;border-radius:50%;padding:0;background:var(--surface);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);border:1px solid var(--line);position:relative}

/* Header */
.top{position:sticky;top:0;z-index:40;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / 0.05);display:flex;align-items:center;gap:12px;padding:12px max(16px,calc((100vw - 1240px)/2));border-bottom:1px solid var(--line);height:var(--header-h)}
.logo{font-size:24px;font-weight:900;color:var(--primary);letter-spacing:-1px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.search{flex:1;max-width:600px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:24px;background:var(--bg);padding:12px 20px 12px 44px;color:var(--text);font-size:14px;transition:border-color 0.2s}
.search input:focus{border-color:var(--primary)}
.search::before{content:'🔍';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0.5}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}

/* Categories */
.cat-nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 max(16px,calc((100vw - 1240px)/2));display:flex;overflow-x:auto;gap:24px;scrollbar-width:none;position:sticky;top:var(--header-h);z-index:30}
.cat-nav::-webkit-scrollbar{display:none}
.cat-item{white-space:nowrap;padding:16px 0;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:0.2s;display:flex;align-items:center;gap:6px;font-size:14px}
.cat-item.active{color:var(--primary);border-bottom-color:var(--primary)}

/* Layout */
.wrap{max-width:1240px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px}
.sectionhead h2{font-size:22px;margin:0;font-weight:800;color:var(--text)}

/* Product Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.product{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);transition:transform 0.2s,box-shadow 0.2s;position:relative;display:flex;flex-direction:column;cursor:pointer}
.product:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.photo{aspect-ratio:1;background:linear-gradient(135deg,var(--bg),var(--line));display:grid;place-items:center;font-size:64px;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s}
.tag{position:absolute;top:12px;left:12px;background:var(--primary);color:#fff;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:800;z-index:2}
.pbody{padding:16px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.pbody h3{margin:0 0 6px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.price{font-size:18px;font-weight:900;color:var(--blue);margin:4px 0}
.meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:8px}
.seller{display:flex;align-items:center;justify-content:space-between;margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--text);font-weight:800;font-size:10px;margin-right:6px}

/* Product Detail Modal */
.detail-img{width:100%;height:300px;background:var(--bg);border-radius:16px;object-fit:cover;margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:80px;border:1px solid var(--line);overflow:hidden}
.detail-img img{width:100%;height:100%;object-fit:contain}
.detail-title{font-size:24px;font-weight:900;margin:0 0 8px}
.detail-price{font-size:28px;font-weight:900;color:var(--blue);margin:0 0 16px}
.detail-desc{color:var(--muted);line-height:1.6;margin-bottom:24px;font-size:15px}
.detail-seller{background:var(--bg);padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.seller-info{display:flex;align-items:center;gap:12px}
.seller-info .avatar{width:48px;height:48px;font-size:20px}

/* Chat System */
.chat-box{display:flex;flex-direction:column;height:400px;background:var(--bg);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5}
.msg.sent{background:var(--primary);color:white;align-self:flex-end;border-bottom-right-radius:4px}
.msg.received{background:var(--surface);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--line)}
.chat-input{display:flex;gap:8px;padding:12px;background:var(--surface);border-top:1px solid var(--line)}
.chat-input input{flex:1;padding:12px;border-radius:24px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.chat-input button{padding:12px 20px;border-radius:24px}

/* Payment Options */
.pay-btn{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-bottom:10px;font-weight:700;color:var(--text);cursor:pointer;transition:0.2s}
.pay-btn:hover{border-color:var(--primary);background:var(--surface)}
.pay-btn img{width:32px;height:32px;border-radius:8px;object-fit:contain}

/* Modals */
.modalback{display:none;position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);z-index:100;align-items:flex-end;justify-content:center;padding:0}
.modalback.show{display:flex}
.modal{width:100%;max-width:520px;max-height:95vh;overflow:auto;background:var(--surface);color:var(--text);border-radius:24px 24px 0 0;padding:24px;animation:slideUp 0.3s;box-shadow:0 -10px 40px #0004}
.modalhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.field{display:grid;gap:8px;margin:16px 0}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px}
.full{width:100%;padding:16px;font-size:16px}

.menu-item{display:flex;align-items:center;gap:16px;padding:16px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--text);background:transparent;width:100%;text-align:left;font-size:16px;margin-bottom:4px;border:1px solid transparent}
.menu-item:hover{background:var(--bg);border-color:var(--line)}
.menu-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--line);flex-shrink:0}

.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;color:#fff}
.login-screen.active{display:flex}
.login-card{width:100%;max-width:420px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,0.5);text-align:center}
.login-card .logo{font-size:36px;margin-bottom:8px;color:#fff;justify-content:center;display:block}
.login-card input{width:100%;padding:16px;margin-bottom:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.2);color:#fff}
.login-card button{width:100%;padding:16px;background:var(--primary);color:#fff;font-size:16px;border-radius:12px;margin-top:8px}
.login-card .switch{font-size:14px;color:#94a3b8;margin-top:24px}
.login-card .switch span{color:var(--primary);cursor:pointer;font-weight:bold}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:8px 0;box-shadow:0 -2px 10px #0001}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center}
.b-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;padding:8px 12px}
.b-nav-item.active{color:var(--primary)}
.b-nav-item span{font-size:20px}

@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .cart-panel{display:none}
  .bottom-nav{display:block}
}
@media(max-width:600px){
  .top{flex-wrap:wrap;height:auto;padding:10px 12px}
  .search{order:3;width:100%;max-width:none;margin-top:4px}
  .cat-nav{top:110px;gap:16px;padding:0 12px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .pbody h3{font-size:13px}
}
</style></head>
<body>

<!-- Login Overlay -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo">VIP<span>MALL</span></div>
    <p style="color:#94a3b8;margin-bottom:24px">የእርስዎ ምርጥ የግዥ ቦታ</p>
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="ኢሜይል / Email">
      <input type="password" id="loginPassword" placeholder="የይለፍ ቃል / Password">
      <button onclick="doLogin()">ግባ / Login</button>
      <div class="switch">መለያ የለህም? <span onclick="showSignup()">ተመዝገብ / Sign Up</span></div>
    </div>
    <div id="signupForm" style="display:none">
      <input type="text" id="signupName" placeholder="ሙሉ ስም / Full Name">
      <input type="email" id="signupEmail" placeholder="ኢሜይል / Email">
      <input type="password" id="signupPassword" placeholder="የይለፍ ቃል / Password">
      <input type="tel" id="signupPhone" placeholder="ስልክ ቁጥር / Phone (09...)">
      <button onclick="doSignup()">ተመዝገብ / Sign Up</button>
      <div class="switch">መለያ አለህ? <span onclick="showLogin()">ግባ / Login</span></div>
    </div>
    <div id="loginError" style="color:#ef4444;font-size:13px;margin-top:12px;font-weight:bold"></div>
  </div>
</div>

<!-- Header -->
<header class="top">
  <div class="logo">VIP MALL <span style="font-size:10px;background:var(--primary);color:white;padding:2px 6px;border-radius:4px;vertical-align:middle">PRO</span></div>
  <div class="search"><input id="search" placeholder="ምርቶችን ይፈልጉ..."></div>
  <div class="top-actions">
    <button class="circle" id="msgBtn" style="font-size:20px">💬</button>
    <button class="circle" id="settingsBtn">☰</button>
  </div>
</header>

<nav class="cat-nav">
  <div class="cat-item active" data-filter="All">🏠 ሁሉም</div>
  <div class="cat-item" data-filter="Electronics">📱 ኤሌክትሮኒክስ</div>
  <div class="cat-item" data-filter="Fashion">👕 ልብስ</div>
  <div class="cat-item" data-filter="Home">🛋️ የቤት ዕቃ</div>
  <div class="cat-item" data-filter="Vehicles">🚗 መኪና</div>
</nav>

<div class="wrap">
  <main>
    <div class="sectionhead">
      <h2>የተመረጡ ምርቶች</h2>
      <span class="meta" id="count">0 ምርቶች</span>
    </div>
    <div class="grid" id="products"></div>
  </main>
</div>

<!-- Mobile Bottom Nav -->
<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <div class="b-nav-item active" onclick="window.scrollTo(0,0)"><span>🏠</span>መነሻ</div>
    <div class="b-nav-item" onclick="document.getElementById('search').focus()"><span>🔍</span>ፍለጋ</div>
    <div class="b-nav-item" onclick="openModal('sell')"><span>➕</span>ሽጥ</div>
    <div class="b-nav-item" onclick="openModal('wallet')"><span>💳</span>ዋሌት</div>
    <div class="b-nav-item" onclick="openModal('menu')"><span>☰</span>ሜኑ</div>
  </div>
</div>

<!-- Modal Container -->
<div class="modalback" id="modalBack">
  <section class="modal">
    <div class="modalhead">
      <h2 id="modalTitle">VIP MALL</h2>
      <button class="circle" id="closeModal" style="width:32px;height:32px;font-size:16px">✕</button>
    </div>
    <div id="modalContent"></div>
  </section>
</div>

<script>
// ==================== DATA & STATE ====================
let currentUser = JSON.parse(localStorage.getItem('vip-user')) || null;
let users = JSON.parse(localStorage.getItem('vip-users')) || {};
let products = JSON.parse(localStorage.getItem('vip-products')) || [
  { id: 1, name: 'Smartphone X Pro', cat: 'Electronics', price: 12500, loc: 'አዲስ አበባ', desc: 'Brand new smartphone with 128GB storage and 48MP camera.', img: '', seller: 'SMART Store', phone: '0911223344' },
  { id: 2, name: 'Fashion Sneakers', cat: 'Fashion', price: 2300, loc: 'ጅማ', desc: 'Original leather sneakers, size 42. Very comfortable.', img: '', seller: 'Abebe Store', phone: '0911556677' },
  { id: 3, name: 'Modern Sofa', cat: 'Home', price: 8000, loc: 'ባህር ዳር', desc: '3-seater modern sofa, excellent condition.', img: '', seller: 'Meron Shop', phone: '0911889900' },
  { id: 4, name: 'Car Spare Parts', cat: 'Vehicles', price: 5600, loc: 'ሀዋሳ', desc: 'Toyota Corolla spare parts. Brand new.', img: '', seller: 'Tadesse Auto', phone: '0912112233' }
];
let messages = JSON.parse(localStorage.getItem('vip-messages')) || {};
let currentFilter = 'All';

const $ = id => document.getElementById(id);

function saveData() {
  localStorage.setItem('vip-products', JSON.stringify(products));
  localStorage.setItem('vip-messages', JSON.stringify(messages));
  localStorage.setItem('vip-users', JSON.stringify(users));
}

// ==================== RENDER PRODUCTS ====================
function renderProducts() {
  const q = $('search').value.toLowerCase();
  const grid = $('products');
  grid.innerHTML = '';
  let count = 0;

  products.filter(p => {
    const matchCat = currentFilter === 'All' || p.cat === currentFilter;
    const matchQ = p.name.toLowerCase().includes(q);
    return matchCat && matchQ;
  }).forEach(p => {
    count++;
    const card = document.createElement('article');
    card.className = 'product';
    card.onclick = () => openProductDetail(p.id);
    card.innerHTML = `
      <div class="photo">
        ${p.img ? `<img src="${p.img}" alt="${p.name}">` : `📦`}
        <span class="tag">NEW</span>
      </div>
      <div class="pbody">
        <h3>${p.name}</h3>
        <div class="price">${p.price.toLocaleString()} ብር</div>
        <div class="meta">📍 ${p.loc}</div>
        <div class="seller">
          <div style="display:flex;align-items:center"><span class="avatar">${p.seller[0]}</span> ${p.seller}</div>
          <span style="color:var(--primary);font-weight:bold">ይመልከቱ →</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  $('count').innerText = count + ' ምርቶች';
}

// ==================== PRODUCT DETAIL ====================
function openProductDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  $('modalTitle').innerText = 'የምርት ዝርዝር';
  $('modalContent').innerHTML = `
    <div class="detail-img">
      ${p.img ? `<img src="${p.img}" alt="${p.name}">` : '📦'}
    </div>
    <h1 class="detail-title">${p.name}</h1>
    <div class="detail-price">${p.price.toLocaleString()} ብር</div>
    <div class="detail-desc">
      <strong>መግለጫ፦</strong><br>${p.desc}<br><br>
      <strong>📍 ቦታ፦</strong> ${p.loc}
    </div>
    
    <div class="detail-seller">
      <div class="seller-info">
        <div class="avatar">${p.seller[0]}</div>
        <div>
          <div style="font-weight:bold;font-size:16px">${p.seller}</div>
          <div style="font-size:12px;color:var(--muted)">የተረጋገጠ ሻጭ</div>
        </div>
      </div>
    </div>

    <button class="primary full" style="margin-bottom:12px;font-size:18px" onclick="contactSeller(${p.id})">💬 ሻጩን አግኝ (Message)</button>
    <a href="tel:${p.phone}" style="text-decoration:none;display:block">
      <button class="soft full" style="font-size:16px;background:var(--line);color:var(--text)">📞 ይደውሉ (${p.phone})</button>
    </a>
  `;
  $('modalBack').classList.add('show');
}

// ==================== CHAT SYSTEM ====================
function contactSeller(productId) {
  if (!currentUser) { checkAuth(); return; }
  const p = products.find(x => x.id === productId);
  const chatId = `chat_${productId}_${currentUser}`;

  if (!messages[chatId]) {
    messages[chatId] = [
      { sender: p.seller, text: `ሰላም! ስለ "${p.name}" ጠይቀዋል። እንዴት ልርዳዎት?`, time: new Date().toLocaleTimeString() }
    ];
    saveData();
  }

  $('modalTitle').innerText = `💬 ${p.seller} ጋር ተወያይ`;
  $('modalContent').innerHTML = `
    <div class="chat-box">
      <div class="chat-messages" id="chatMsgs">
        ${messages[chatId].map(m => `
          <div class="msg ${m.sender === currentUser ? 'sent' : 'received'}">
            ${m.text}
            <div style="font-size:10px;opacity:0.7;margin-top:4px;text-align:right">${m.time}</div>
          </div>
        `).join('')}
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="መልእክት ይጻፉ..." onkeypress="if(event.key==='Enter') sendMsg('${chatId}', '${p.seller}', ${p.id})">
        <button class="primary" onclick="sendMsg('${chatId}', '${p.seller}', ${p.id})">ላክ</button>
      </div>
    </div>
  `;
  
  setTimeout(() => {
    const msgs = $('chatMsgs');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }, 100);
}

function sendMsg(chatId, sellerName, productId) {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;

  messages[chatId].push({ sender: currentUser, text, time: new Date().toLocaleTimeString() });
  saveData();
  input.value = '';
  
  const msgs = $('chatMsgs');
  const div = document.createElement('div');
  div.className = 'msg sent';
  div.innerHTML = `${text}<div style="font-size:10px;opacity:0.7;margin-top:4px;text-align:right">${new Date().toLocaleTimeString()}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;

  // Simulate Reply
  setTimeout(() => {
    messages[chatId].push({ sender: sellerName, text: "እሺ፣ ተረዳሁ። በቅርቡ እናገኝዎታለን።", time: new Date().toLocaleTimeString() });
    saveData();
    const replyDiv = document.createElement('div');
    replyDiv.className = 'msg received';
    replyDiv.innerHTML = `እሺ፣ ተረዳሁ። በቅርቡ እናገኝዎታለን።<div style="font-size:10px;opacity:0.7;margin-top:4px">${new Date().toLocaleTimeString()}</div>`;
    msgs.appendChild(replyDiv);
    msgs.scrollTop = msgs.scrollHeight;
  }, 1500);
}

function openInbox() {
  if (!currentUser) { checkAuth(); return; }
  const chatIds = Object.keys(messages);
  $('modalTitle').innerText = '💬 የመልእክት ሳጥን';
  if (chatIds.length === 0) {
    $('modalContent').innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">ምንም መልእክት የለም</div>';
  } else {
    $('modalContent').innerHTML = chatIds.map(id => {
      const parts = id.split('_');
      const prodId = parts[1];
      const prod = products.find(x => x.id == prodId) || { name: 'Unknown', seller: 'Seller' };
      const lastMsg = messages[id][messages[id].length - 1];
      return `
        <div class="menu-item" onclick="contactSeller(${prodId})">
          <div class="menu-icon">💬</div>
          <div style="flex:1;overflow:hidden">
            <div style="font-weight:bold">${prod.seller}</div>
            <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lastMsg.text}</div>
          </div>
        </div>
      `;
    }).join('');
  }
  $('modalBack').classList.add('show');
}

// ==================== SELL PRODUCT ====================
function openSellModal() {
  if (!currentUser) { checkAuth(); return; }
  $('modalTitle').innerText = '➕ አዲስ እቃ ሽጥ';
  $('modalContent').innerHTML = `
    <div class="field"><label>የእቃው ስም</label><input id="sellName" placeholder="ለምሳሌ፡ iPhone 13"></div>
    <div class="field"><label>ምድብ</label>
      <select id="sellCat"><option value="Electronics">📱 ኤሌክትሮኒክስ</option><option value="Fashion">👕 ልብስ</option><option value="Home">🛋️ የቤት ዕቃ</option><option value="Vehicles">🚗 መኪና</option></select>
    </div>
    <div class="field"><label>ዋጋ (ብር)</label><input id="sellPrice" type="number" placeholder="0"></div>
    <div class="field"><label>አካባቢ (Location)</label><input id="sellLoc" placeholder="ለምሳሌ፡ አዲስ አበባ"></div>
    <div class="field"><label>መግለጫ</label><textarea id="sellDesc" placeholder="ስለ እቃው አጭር መግለጫ ይጻፉ..."></textarea></div>
    <div class="field"><label>ፎቶ (ከስልክዎ ይምረጡ)</label><input type="file" id="sellImg" accept="image/*" style="padding:10px"></div>
    <button class="primary full" onclick="publishProduct()">እቃውን አሳይ</button>
  `;
  $('modalBack').classList.add('show');
}

function publishProduct() {
  const name = $('sellName').value.trim();
  const cat = $('sellCat').value;
  const price = Number($('sellPrice').value);
  const loc = $('sellLoc').value.trim() || 'አዲስ አበባ';
  const desc = $('sellDesc').value.trim() || 'ምንም መግለጫ የለም።';
  const phone = users[currentUser].phone || '0900000000';
  const imgFile = $('sellImg').files[0];

  if (!name || !price) { alert('ስም እና ዋጋ ያስፈልጋሉ!'); return; }

  const saveProduct = (imgData) => {
    const newProduct = {
      id: Date.now(), name, cat, price, loc, desc, img: imgData, seller: users[currentUser].name, phone
    };
    products.unshift(newProduct);
    saveData();
    closeModal();
    renderProducts();
    alert('✅ እቃው በተሳካ ሁኔታ ተለጥፏል!');
  };

  if (imgFile) {
    const reader = new FileReader();
    reader.onload = (e) => saveProduct(e.target.result);
    reader.readAsDataURL(imgFile);
  } else {
    saveProduct('');
  }
}

// ==================== WALLET & PAYMENTS ====================
function openWallet() {
  if (!currentUser) { checkAuth(); return; }
  const bal = users[currentUser].balance;
  $('modalTitle').innerText = '💳 የገንዘብ ቦርሳ';
  $('modalContent').innerHTML = `
    <div style="text-align:center;padding:24px;background:var(--bg);border-radius:16px;margin-bottom:20px">
      <div style="font-size:14px;color:var(--muted);margin-bottom:8px">ያለህ ቀሪ ሂሳብ</div>
      <div style="font-size:36px;font-weight:900;color:var(--blue)">${bal.toLocaleString()} ብር</div>
    </div>
    <h4 style="margin:0 0 12px;color:var(--muted)">የክፍያ መንገድ ምረጥ</h4>
    
    <button class="pay-btn" onclick="window.open('https://t.me/telebirr_official', '_blank')">
      <span style="font-size:24px">📱</span> Telebirr (ቴሌብር)
    </button>
    <button class="pay-btn" onclick="window.open('https://cbe.com.et', '_blank')">
      <span style="font-size:24px">🏦</span> CBE Birr (የኢትዮጵያ ንግድ ባንክ)
    </button>
    <button class="pay-btn" onclick="window.open('https://www.awashbank.com', '_blank')">
      <span style="font-size:24px">🏛️</span> Awash Bank (አዋሽ ባንክ)
    </button>
    
    <div style="margin-top:24px;border-top:1px solid var(--line);padding-top:24px">
      <h4 style="margin:0 0 12px;color:var(--muted)">ወይም በእጅ ያስገቡ (አስመስሎ)</h4>
      <div class="field"><label>መጠን (ብር)</label><input id="walletAmt" type="number" placeholder="0" min="10"></div>
      <button class="primary full" onclick="simulateDeposit()">አስገባ</button>
    </div>
  `;
  $('modalBack').classList.add('show');
}

function simulateDeposit() {
  const amt = Number($('walletAmt').value);
  if (!amt || amt < 10) { alert('ትክክለኛ መጠን ያስገቡ!'); return; }
  users[currentUser].balance += amt;
  saveData();
  alert('✅ ገንዘብ በተሳካ ሁኔታ ገብቷል! (ለሙከራ ብቻ)');
  openWallet();
}

// ==================== AUTH SYSTEM ====================
function checkAuth() {
  if (!currentUser) $('loginScreen').classList.add('active');
  else $('loginScreen').classList.remove('active');
}

function showSignup() {
  $('loginForm').style.display = 'none';
  $('signupForm').style.display = 'block';
  $('loginError').innerText = '';
}

function showLogin() {
  $('signupForm').style.display = 'none';
  $('loginForm').style.display = 'block';
  $('loginError').innerText = '';
}

function doSignup() {
  const name = $('signupName').value.trim();
  const email = $('signupEmail').value.trim();
  const pass = $('signupPassword').value;
  const phone = $('signupPhone').value.trim();
  
  if (!name || !email || !pass || !phone) { $('loginError').innerText = 'ሁሉንም መረጃ ያስገቡ!'; return; }
  if (users[email]) { $('loginError').innerText = 'ይህ ኢሜይል ተመዝግቧል!'; return; }
  
  users[email] = { name, pass, phone, balance: 0 };
  currentUser = email;
  localStorage.setItem('vip-user', JSON.stringify(currentUser));
  saveData();
  checkAuth();
}

function doLogin() {
  const email = $('loginEmail').value.trim();
  const pass = $('loginPassword').value;
  if (users[email] && users[email].pass === pass) {
    currentUser = email;
    localStorage.setItem('vip-user', JSON.stringify(currentUser));
    checkAuth();
  } else {
    $('loginError').innerText = 'ኢሜይል ወይም የይለፍ ቃል ስህተት ነው!';
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem('vip-user');
  checkAuth();
  closeModal();
}

// ==================== MENU & LANGUAGE ====================
function openModal(type) {
  if (type === 'sell') openSellModal();
  else if (type === 'wallet') openWallet();
  else if (type === 'menu') {
    $('modalTitle').innerText = '☰ ሜኑ';
    $('modalContent').innerHTML = `
      <button class="menu-item" onclick="openInbox()"><div class="menu-icon">💬</div> የመልእክት ሳጥን (Inbox)</button>
      <button class="menu-item" onclick="openSellModal()"><div class="menu-icon">➕</div> እቃ ሽጥ (Sell Item)</button>
      <button class="menu-item" onclick="openWallet()"><div class="menu-icon">💳</div> የገንዘብ ቦርሳ (Wallet)</button>
      <div style="height:1px;background:var(--line);margin:12px 0"></div>
      <button class="menu-item" onclick="openLanguageModal()"><div class="menu-icon">🌐</div> ቋንቋ (Language)</button>
      <button class="menu-item" onclick="toggleTheme()"><div class="menu-icon">🌙</div> ጨለማ ሁነታ (Dark Mode)</button>
      <div style="height:1px;background:var(--line);margin:12px 0"></div>
      <button class="menu-item" onclick="logout()" style="color:var(--primary)"><div class="menu-icon" style="background:#fee2e2;color:var(--primary)">🚪</div> ውጣ (Logout)</button>
    `;
    $('modalBack').classList.add('show');
  }
}

function changeLanguage(lang) {
  alert('ቋንቋ ወደ ' + lang.toUpperCase() + ' ተቀይሯል! (ለሙከራ)');
  // Real translation logic would go here
}

function closeModal() { $('modalBack').classList.remove('show'); }

// Search & Filter
$('search').addEventListener('input', renderProducts);
document.querySelectorAll('.cat-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentFilter = item.dataset.filter;
    renderProducts();
  });
});

// Theme
function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('vip-dark', document.body.classList.contains('dark') ? '1' : '0');
  closeModal();
}
if (localStorage.getItem('vip-dark') === '1') document.body.classList.add('dark');

// Events
$('settingsBtn').onclick = () => openModal('menu');
$('msgBtn').onclick = () => openInbox();
$('closeModal').onclick = closeModal;
$('modalBack').onclick = (e) => { if (e.target === $('modalBack')) closeModal(); };

// INIT
renderProducts();
checkAuth();
</script>
