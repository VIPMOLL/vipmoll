<style>
/* 3D Neumorphism Design System */
:root {
  --bg: #e0e5ec;
  --text: #2d3748;
  --text-light: #718096;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --shadow-light: #ffffff;
  --shadow-dark: #a3b1c6;
  --radius: 20px;
  --header-h: 70px;
}

/* Dark Mode Variables */
body.dark-mode {
  --bg: #1a202c;
  --text: #e2e8f0;
  --text-light: #a0aec0;
  --primary: #63b3ed;
  --primary-hover: #4299e1;
  --shadow-light: #2d3748;
  --shadow-dark: #0f1115;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans Ethiopic", Arial, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 70px;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
}

/* Global 3D Elements */
.neu-card {
  background: var(--bg);
  border-radius: var(--radius);
  box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
  padding: 24px;
}

.neu-input {
  width: 100%;
  padding: 16px 20px;
  border: none;
  outline: none;
  background: var(--bg);
  border-radius: 12px;
  box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  color: var(--text);
  font-size: 15px;
  transition: all 0.2s;
  font-weight: 500;
}
.neu-input:focus {
  box-shadow: inset 6px 6px 10px var(--shadow-dark), inset -6px -6px 10px var(--shadow-light);
}

.neu-btn {
  width: 100%;
  padding: 16px;
  border: none;
  outline: none;
  background: var(--primary);
  color: white;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
}
.neu-btn:active {
  box-shadow: inset 4px 4px 8px var(--primary-hover), inset -4px -4px 8px rgba(255,255,255,0.2);
  transform: translateY(2px);
}
.neu-btn.secondary {
  background: var(--bg);
  color: var(--text-light);
  box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
}
.neu-btn.secondary:active {
  box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
}

/* Header */
.top {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px max(16px, calc((100vw - 1240px)/2));
  height: var(--header-h);
  box-shadow: 0 4px 12px rgba(163, 177, 198, 0.2);
  transition: background 0.3s;
}
.logo-img { height: 40px; object-fit: contain; border-radius: 8px; }
.search { flex: 1; position: relative; width: 100%; max-width: none; }
.search input {
  width: 100%; border: none; border-radius: 24px; background: var(--bg);
  padding: 12px 20px 12px 44px; color: var(--text);
  box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  font-size: 14px; transition: 0.2s;
}
.search::before { content: '🔍'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text-light); }
.top-actions { display: flex; gap: 8px; margin-left: auto; }
.circle-btn {
  width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--bg);
  box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  cursor: pointer; color: var(--text); transition: 0.2s;
}
.circle-btn:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }

/* Categories & Products */
.cat-nav { background: var(--bg); padding: 10px max(16px, calc((100vw - 1240px)/2)); display: flex; overflow-x: auto; gap: 12px; scrollbar-width: none; border-bottom: 1px solid var(--shadow-dark); transition: background 0.3s; }
.cat-nav::-webkit-scrollbar { display: none; }
.cat-item { white-space: nowrap; padding: 10px 16px; background: var(--bg); border-radius: 20px; box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); color: var(--text-light); font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
.cat-item.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--primary); }

.wrap { max-width: 1240px; margin: 20px auto; padding: 0 16px; }
.sectionhead { display: flex; justify-content: space-between; align-items: center; margin: 0 0 16px; }
.sectionhead h2 { font-size: 20px; margin: 0; font-weight: 800; color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
.product { background: var(--bg); border-radius: var(--radius); overflow: hidden; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); padding: 12px; cursor: pointer; transition: 0.2s; position: relative; }
.product:hover { transform: translateY(-2px); }
.photo { aspect-ratio: 1; background: var(--bg); border-radius: 12px; box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); display: grid; place-items: center; font-size: 50px; margin-bottom: 12px; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.tag { position: absolute; top: 20px; left: 20px; background: var(--primary); color: white; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; }
.pbody h3 { margin: 0 0 6px; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.price { font-size: 16px; font-weight: 900; color: var(--primary); }
.meta { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* Modals */
.modalback { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 100; align-items: flex-end; justify-content: center; padding: 0; }
.modalback.show { display: flex; }
.modal { width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; background: var(--bg); border-radius: 30px 30px 0 0; padding: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); animation: slideUp 0.3s; transition: background 0.3s; }
.modalhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modalhead h2 { font-size: 20px; font-weight: 800; margin: 0; }
.field { margin-bottom: 16px; position: relative; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--text-light); margin-bottom: 8px; }
.eye-icon { position: absolute; right: 16px; bottom: 16px; cursor: pointer; font-size: 18px; color: var(--text-light); user-select: none; }
.menu-item { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; cursor: pointer; font-weight: 700; color: var(--text); background: var(--bg); width: 100%; text-align: left; font-size: 15px; margin-bottom: 10px; border: none; box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); transition: 0.2s; }
.menu-item:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }

/* Auth Screen */
.auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; transition: background 0.3s; }
.auth-screen.active { display: flex; }
.auth-card { width: 100%; max-width: 380px; text-align: center; position: relative; padding: 40px 30px; }
.auth-icon { width: 70px; height: 70px; background: var(--bg); border-radius: 50%; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 20px; color: var(--primary); }
.auth-title { font-size: 24px; font-weight: 900; margin: 0 0 8px; }
.auth-sub { font-size: 14px; color: var(--text-light); margin: 0 0 30px; }
.auth-switch { margin-top: 24px; font-size: 14px; color: var(--text-light); font-weight: 600; }
.auth-switch span { color: var(--primary); cursor: pointer; font-weight: 800; }
.auth-error { color: #ef4444; font-size: 13px; font-weight: 700; margin-top: 15px; min-height: 20px; }
.login-tabs { display: flex; background: var(--bg); padding: 6px; border-radius: 16px; box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); margin-bottom: 24px; }
.login-tabs button { flex: 1; padding: 12px; border-radius: 12px; border: none; background: transparent; color: var(--text-light); font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
.login-tabs button.active { background: var(--bg); color: var(--primary); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); }
#recaptcha-container { display: none; margin-bottom: 16px; }

/* Bottom Nav */
.bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); z-index: 50; padding: 10px 0; box-shadow: 0 -4px 12px rgba(163, 177, 198, 0.4); transition: background 0.3s; }
.bottom-nav-inner { display: flex; justify-content: space-around; align-items: center; }
.b-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-light); font-size: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
.b-nav-item.active { color: var(--primary); }
.b-nav-item span:first-child { font-size: 22px; }

@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 900px) {
  .bottom-nav { display: block; }
  .top { padding: 10px 16px; height: auto; flex-wrap: wrap; }
  .search { order: 3; width: 100%; margin-top: 8px; }
  .cat-nav { top: 110px; }
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen active" id="authScreen">
  <div class="auth-card neu-card">
    <!-- Login Form -->
    <div id="loginView">
      <div class="auth-icon">🔒</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">ወደ VIP MALL እንኳን ደህና መጡ</p>
      
      <div class="login-tabs" id="loginTabs">

          <div class="field"><input type="text" id="loginOtp" class="neu-input" placeholder="6-digit Code" maxlength="6" style="text-align:center; letter-spacing:8px; font-weight:900; font-size:20px;"></div>
          <button class="neu-btn" onclick="verifyPhoneCode()">Verify Access</button>

      <p class="auth-sub">የእርስዎን መለያ ይፍጠሩ</p>
      <div class="field"><input type="text" id="signupName" class="neu-input" placeholder="Full Name"></div>
      <div class="field"><input type="email" id="signupEmail" class="neu-input" placeholder="Email Address"></div>
      <div class="field">
        <input type="password" id="signupPassword" class="neu-input" placeholder="Password (min 6 chars)">
        <span class="eye-icon" onclick="togglePass('signupPassword', this)">👁️</span>
      </div>
      <div class="field"><input type="tel" id="signupPhone" class="neu-input" placeholder="Phone Number (09...)"></div>
      <button class="neu-btn" onclick="doSignup()">Create Account</button>
      <div class="auth-switch">Already have an account? <span onclick="toggleAuthView('login')">Login</span></div>
    </div>
    <div class="auth-error" id="authError"></div>

</div>

<!-- HEADER -->
<header class="top">
  <img src="logo.png" alt="VIP MALL" class="logo-img" onerror="this.outerHTML='<div style=\'font-size:20px;font-weight:900;color:var(--primary)\'>VIP MALL</div>'">

<div class="wrap">
  <div class="sectionhead">
    <h2>Featured Products</h2>
    <span style="font-size:13px; color:var(--text-light); font-weight:600" id="count">0 items</span>

</div>

<!-- Mobile Bottom Nav -->

  <div class="bottom-nav-inner">

    <div class="b-nav-item" onclick="document.getElementById('search').focus()"><span>🔍</span>Search</div>

<!-- Modal Container -->
<div class="modalback" id="modalBack">
  <section class="modal">
    <div class="modalhead">
      <h2 id="modalTitle">VIP MALL</h2>
      <button class="circle-btn" id="closeModal" style="width:36px;height:36px;font-size:16px;box-shadow:none;background:var(--bg);">✕</button>
    </div>

<script>
// ==================== GLOBAL STATE ====================
let currentUser = JSON.parse(localStorage.getItem('vip-user')) || null;
let users = JSON.parse(localStorage.getItem('vip-users')) || {};
let products = JSON.parse(localStorage.getItem('vip-products')) || [
  { id: 1, name: 'Smartphone X Pro', cat: 'Electronics', price: 12500, loc: 'Addis Ababa', desc: 'Brand new 128GB.', img: '', seller: 'SMART Store', phone: '0911223344' },
  { id: 2, name: 'Fashion Sneakers', cat: 'Fashion', price: 2300, loc: 'Jimma', desc: 'Original leather.', img: '', seller: 'Abebe Store', phone: '0911556677' }
];
let messages = JSON.parse(localStorage.getItem('vip-messages')) || {};
let currentFilter = 'All';
let confirmationResult = null;

const $ = id => document.getElementById(id);

function saveData() {
  localStorage.setItem('vip-products', JSON.stringify(products));
  localStorage.setItem('vip-messages', JSON.stringify(messages));
  localStorage.setItem('vip-users', JSON.stringify(users));
}

// ==================== DARK MODE LOGIC ====================
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  localStorage.setItem('vip-dark-mode', isDark ? 'true' : 'false');
  
  // Update meta theme-color
  document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#1a202c' : '#e0e5ec');
  
  closeModal();
  setTimeout(() => openModal('menu'), 100); // Refresh menu to show correct text
}

// Apply saved theme on load
if (localStorage.getItem('vip-dark-mode') === 'true') {
  document.body.classList.add('dark-mode');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a202c');
}

// ==================== AUTH SYSTEM ====================
function togglePass(id, icon) {
  const input = document.getElementById(id);
  if (input.type === "password") { input.type = "text"; icon.innerText = "🙈"; }
  else { input.type = "password"; icon.innerText = "👁️"; }
}

function toggleAuthView(view) {
  $('authError').innerText = '';
  if(view === 'signup') {
    $('loginView').style.display = 'none';
    $('signupView').style.display = 'block';
  } else {
    $('signupView').style.display = 'none';
    $('loginView').style.display = 'block';
  }
}

function switchAuthTab(type) {
  document.querySelectorAll('#loginTabs button').forEach(b => b.classList.remove('active'));
  if (type === 'email') {
    document.querySelectorAll('#loginTabs button')[0].classList.add('active');
    $('emailLoginForm').style.display = 'block';
    $('phoneLoginForm').style.display = 'none';
  } else {
    document.querySelectorAll('#loginTabs button')[1].classList.add('active');
    $('emailLoginForm').style.display = 'none';
    $('phoneLoginForm').style.display = 'block';
  }
}

async function doEmailLogin() {
  const email = $('loginEmail').value.trim();
  const pass = $('loginPassword').value;
  if (!email || !pass) { $('authError').innerText = 'Fill all fields!'; return; }
  
  try {
    await window.fbSignIn(window.auth, email, pass);
    loginSuccess(email);
  } catch(e) {
    $('authError').innerText = e.message.replace('Firebase: ', '');
  }
}

async function doSignup() {
  const name = $('signupName').value.trim();
  const email = $('signupEmail').value.trim();
  const pass = $('signupPassword').value;
  const phone = $('signupPhone').value.trim();
  
  if (!name || !email || !pass || !phone) { $('authError').innerText = 'Fill all fields!'; return; }
  if (pass.length < 6) { $('authError').innerText = 'Password must be 6+ chars!'; return; }
  
  try {
    await window.fbCreateUser(window.auth, email, pass);
    users[email] = { name, phone, balance: 0 };
    saveData();
    loginSuccess(email);
  } catch(e) {
    $('authError').innerText = e.message.replace('Firebase: ', '');
  }
}

async function doPhoneLogin() {
  const phone = $('loginPhone').value.trim();
  if (!phone) { $('authError').innerText = 'Enter phone number!'; return; }
  
  $('authError').innerText = 'Sending SMS...';
  $('recaptcha-container').style.display = 'block';
  
  try {
    if (!window.recaptchaVerifier) {
      window.recaptchaVerifier = new window.fbRecaptcha(window.auth, 'recaptcha-container', { size: 'invisible' });
    }
    confirmationResult = await window.fbPhoneSignIn(window.auth, phone, window.recaptchaVerifier);
    $('authError').innerText = '';
    $('otpInputDiv').style.display = 'block';
    $('sendSmsBtn').innerText = 'Resend Code';
  } catch(e) {
    $('authError').innerText = e.message.replace('Firebase: ', '');
    $('recaptcha-container').style.display = 'none';
  }
}

async function verifyPhoneCode() {
  const code = $('loginOtp').value.trim();
  if (!code) return;
  
  try {
    const result = await confirmationResult.confirm(code);
    loginSuccess(result.user.phoneNumber);
  } catch(e) {
    $('authError').innerText = 'Invalid code!';
  }
}

function loginSuccess(identifier) {
  currentUser = identifier;
  localStorage.setItem('vip-user', JSON.stringify(currentUser));
  if (!users[identifier]) users[identifier] = { name: identifier.split('@')[0] || 'User', phone: identifier, balance: 0 };
  saveData();
  checkAuth();
}

function doLogout() {
  window.fbSignOut(window.auth).catch(()=>{});
  currentUser = null;
  localStorage.removeItem('vip-user');
  checkAuth();
  closeModal();
}

function checkAuth() {
  if (!currentUser) $('authScreen').classList.add('active');
  else $('authScreen').classList.remove('active');
}

// ==================== PRODUCT RENDER ====================
function renderProducts() {
  const q = $('search').value.toLowerCase();
  const grid = $('products');
  grid.innerHTML = '';
  let count = 0;

  products.filter(p => {
    const matchCat = currentFilter === 'All' || p.cat === currentFilter;
    const matchQ = p.name.toLowerCase().includes(q);
    return matchCat && matchQ;
  }).forEach(p => {
    count++;
    const card = document.createElement('article');
    card.className = 'product';
    card.onclick = () => openProductDetail(p.id);
    card.innerHTML = `
      <div class="photo">
        ${p.img ? `<img src="${p.img}">` : `📦`}
        <span class="tag">NEW</span>
      </div>
      <div class="pbody">
        <h3>${p.name}</h3>
        <div class="price">${p.price.toLocaleString()} ETB</div>
        <div class="meta">📍 ${p.loc}</div>
      </div>
    `;
    grid.appendChild(card);
  });
  $('count').innerText = count + ' items';
}

// ==================== MODALS & ACTIONS ====================
function openProductDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  $('modalTitle').innerText = 'Product Details';
  $('modalContent').innerHTML = `
    <div style="width:100%;height:250px;background:var(--bg);border-radius:16px;box-shadow:inset 4px 4px 8px var(--shadow-dark);margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden">
      ${p.img ? `<img src="${p.img}" style="width:100%;height:100%;object-fit:contain">` : '📦'}
    </div>
    <h1 style="font-size:22px;margin:0 0 8px">${p.name}</h1>
    <div style="font-size:24px;font-weight:900;color:var(--primary);margin-bottom:16px">${p.price.toLocaleString()} ETB</div>
    <div style="color:var(--text-light);line-height:1.6;margin-bottom:20px;font-size:14px">
      ${p.desc}<br><br><strong>📍 Location:</strong> ${p.loc}
    </div>
    <div style="background:var(--bg);padding:16px;border-radius:16px;box-shadow:4px 4px 8px var(--shadow-dark);display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div style="width:40px;height:40px;background:var(--primary);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px">${p.seller[0]}</div>
      <div>
        <div style="font-weight:800">${p.seller}</div>
        <div style="font-size:11px;color:var(--text-light)">Verified Seller</div>
      </div>
    </div>
    <button class="neu-btn" style="margin-bottom:12px" onclick="contactSeller(${p.id})">💬 Message Seller</button>
    <a href="tel:${p.phone}" style="text-decoration:none"><button class="neu-btn secondary">📞 Call (${p.phone})</button></a>
  `;
  $('modalBack').classList.add('show');
}

function contactSeller(productId) {
  if (!currentUser) { checkAuth(); return; }
  const p = products.find(x => x.id === productId);
  const chatId = `chat_${productId}_${currentUser}`;

  if (!messages[chatId]) {
    messages[chatId] = [{ sender: p.seller, text: `Hello! You asked about "${p.name}".`, time: new Date().toLocaleTimeString() }];
    saveData();
  }

  $('modalTitle').innerText = `Chat with ${p.seller}`;
  $('modalContent').innerHTML = `
    <div style="display:flex;flex-direction:column;height:350px;background:var(--bg);border-radius:16px;box-shadow:inset 4px 4px 8px var(--shadow-dark);overflow:hidden">
      <div class="chat-messages" id="chatMsgs" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px">
        ${messages[chatId].map(m => `
          <div style="max-width:85%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.4;${m.sender === currentUser ? 'background:var(--primary);color:white;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:4px 4px 10px rgba(59,130,246,0.3)' : 'background:var(--bg);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:4px 4px 8px var(--shadow-dark)'}">
            ${m.text}
          </div>
        `).join('')}
      </div>
      <div style="display:flex;gap:8px;padding:12px;background:var(--bg);border-top:1px solid var(--shadow-dark)">
        <input type="text" id="chatInput" class="neu-input" placeholder="Type a message..." style="padding:12px;flex:1" onkeypress="if(event.key==='Enter') sendMsg('${chatId}', '${p.seller}', ${p.id})">
        <button class="neu-btn" style="width:auto;padding:12px 20px" onclick="sendMsg('${chatId}', '${p.seller}', ${p.id})">Send</button>
      </div>
    </div>
  `;
  setTimeout(() => { const m = $('chatMsgs'); if(m) m.scrollTop = m.scrollHeight; }, 100);
}

function sendMsg(chatId, sellerName, productId) {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;
  messages[chatId].push({ sender: currentUser, text, time: new Date().toLocaleTimeString() });
  saveData();
  contactSeller(productId);
}

function openModal(type) {
  if (type === 'sell') {
    if (!currentUser) { checkAuth(); return; }
    $('modalTitle').innerText = 'Sell New Item';
    $('modalContent').innerHTML = `
      <div class="field"><label>Product Name</label><input id="sellName" class="neu-input" placeholder="iPhone 13"></div>
      <div class="field"><label>Category</label>
        <select id="sellCat" class="neu-input">
          <option value="Electronics">📱 Electronics</option><option value="Fashion">👕 Fashion</option><option value="Home">🛋️ Home</option><option value="Vehicles">🚗 Vehicles</option>
        </select>
      </div>
      <div class="field"><label>Price (ETB)</label><input id="sellPrice" type="number" class="neu-input" placeholder="0"></div>
      <div class="field"><label>Location</label><input id="sellLoc" class="neu-input" placeholder="Addis Ababa"></div>
      <div class="field"><label>Description</label><textarea id="sellDesc" class="neu-input" placeholder="..."></textarea></div>
      <div class="field"><label>Photo</label><input type="file" id="sellImg" accept="image/*" class="neu-input" style="padding:10px"></div>
      <button class="neu-btn" onclick="publishProduct()">Publish Item</button>
    `;
    $('modalBack').classList.add('show');
  }
  else if (type === 'wallet') {
    if (!currentUser) { checkAuth(); return; }
    const bal = users[currentUser]?.balance || 0;
    $('modalTitle').innerText = 'My Wallet';
    $('modalContent').innerHTML = `
      <div style="text-align:center;padding:24px;background:var(--bg);border-radius:16px;box-shadow:inset 4px 4px 8px var(--shadow-dark);margin-bottom:20px">
        <div style="font-size:13px;color:var(--text-light);margin-bottom:4px;font-weight:700">Available Balance</div>
        <div style="font-size:32px;font-weight:900;color:var(--primary)">${bal.toLocaleString()} ETB</div>
      </div>
      <h4 style="margin:0 0 12px;color:var(--text-light);font-size:14px">Payment Methods</h4>
      <button class="menu-item" onclick="window.open('https://play.google.com/store/apps/details?id=com.ethiotelecom.telebirr', '_blank')">
        <div style="width:40px;height:40px;background:#00a651;color:white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px">📱</div> Telebirr
      </button>
      <button class="menu-item" onclick="window.open('https://play.google.com/store/apps/details?id=com.cbe.cbebirr', '_blank')">
        <div style="width:40px;height:40px;background:#4a148c;color:white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px">🏦</div> CBE Birr
      </button>
      <div style="margin-top:20px">
        <h4 style="margin:0 0 12px;color:var(--text-light);font-size:14px">Manual Deposit (Test)</h4>
        <div class="field"><input id="walletAmt" type="number" class="neu-input" placeholder="Amount (ETB)" min="10"></div>
        <button class="neu-btn" onclick="simulateDeposit()">Deposit</button>
      </div>
    `;
    $('modalBack').classList.add('show');
  }
  else if (type === 'menu') {
    $('modalTitle').innerText = 'Menu';
    $('modalContent').innerHTML = `
      <button class="menu-item" onclick="openModal('sell')">➕ Sell Item</button>
      <button class="menu-item" onclick="openModal('wallet')">💳 Wallet</button>
      <button class="menu-item" onclick="toggleDarkMode()" id="darkModeBtn">
        ${document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode'}
      </button>
      <button class="menu-item" onclick="doLogout()" style="color:var(--primary)">🚪 Logout</button>
    `;
    $('modalBack').classList.add('show');
  }
}

function publishProduct() {
  const name = $('sellName').value.trim();
  const cat = $('sellCat').value;
  const price = Number($('sellPrice').value);
  const loc = $('sellLoc').value.trim() || 'Addis Ababa';
  const desc = $('sellDesc').value.trim() || 'No description';
  const phone = users[currentUser]?.phone || '0900000000';
  const imgFile = $('sellImg').files[0];

  if (!name || !price) { alert('Name & Price required!'); return; }
  const saveProduct = (imgData) => {
    products.unshift({ id: Date.now(), name, cat, price, loc, desc, img: imgData, seller: users[currentUser]?.name || 'User', phone });
    saveData(); closeModal(); renderProducts(); alert('✅ Item published!');
  };

  if (imgFile) {
    const reader = new FileReader();
    reader.onload = (e) => saveProduct(e.target.result);
    reader.readAsDataURL(imgFile);
  } else saveProduct('');
}

function simulateDeposit() {
  const amt = Number($('walletAmt').value);
  if (!amt || amt < 10) { alert('Enter valid amount!'); return; }
  users[currentUser].balance += amt;
  saveData(); alert('✅ Deposited!'); openModal('wallet');
}

function closeModal() { $('modalBack').classList.remove('show'); }

// ==================== INIT & EVENTS ====================
$('search').addEventListener('input', renderProducts);
document.querySelectorAll('.cat-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentFilter = item.dataset.filter;
    renderProducts();
  });
});

$('settingsBtn').onclick = () => openModal('menu');
$('msgBtn').onclick = () => {
    alert('የመልእክት ሳጥን በቅርቡ ይመጣል! (Message feature coming soon)');
};
$('closeModal').onclick = closeModal;
$('modalBack').onclick = (e) => { if (e.target === $('modalBack')) closeModal(); };

renderProducts();
checkAuth();
</script>
</body></html>
